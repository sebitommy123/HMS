[project]
name = "datapro-ai"
version = "0.0.1"
description = "DataPro AI — the AI plane: LLM-mediated chat with tool access to DataPro Core."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.45",
    "flask>=3.0",
    "flask-cors>=6.0",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapro_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration tests that hit real Anthropic API + real Core (require ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
