# Keyed on HMS_STACK, this checkout's stack slot — see ../datapro/docker-compose.yml
# for the full note. scripts/hms.py sets it and the ports; there are no defaults,
# so a bare `docker compose` here fails loudly instead of touching another
# checkout's containers. By hand: eval "$(scripts/hms.py env)"
name: hms-${HMS_STACK:?unset — run via scripts/, or eval "$(scripts/hms.py env)"}-ai

# AI is single-instance by design (matches Core; see ../core/README.md § Deployment model).
# Do not scale the `ai` service to >1 replicas — the agent loop holds in-memory state per
# request and conversations are not designed for cross-process coordination.

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: hms-${HMS_STACK}-ai-postgres
    environment:
      POSTGRES_DB: datapro_ai
      POSTGRES_USER: datapro
      POSTGRES_PASSWORD: datapro
    ports:
      - "${AI_PG_PORT:?unset — see above}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapro -d datapro_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: .
    container_name: hms-${HMS_STACK}-ai
    environment:
      DATABASE_URL: postgresql+psycopg://datapro:datapro@postgres:5432/datapro_ai
      CORE_URL: http://host.docker.internal:${CORE_PORT:?unset — see above}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "${AI_PORT:?unset — see above}:5002"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
