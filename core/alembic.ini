[alembic]
script_location = alembic
prepend_sys_path = src
# Fallback only — alembic/env.py prefers DATABASE_URL, which scripts/migrate.sh
# sets to this checkout's own database. This value is the main clone's slot.
sqlalchemy.url = postgresql+psycopg://datapro:datapro@localhost:5005/datapro_core

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
