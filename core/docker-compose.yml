# Keyed on HMS_STACK, this checkout's stack slot — see ../datapro/docker-compose.yml
# for the full note. scripts/hms.py sets it and the ports; there are no defaults,
# so a bare `docker compose` here fails loudly instead of touching another
# checkout's containers. By hand: eval "$(scripts/hms.py env)"
name: hms-${HMS_STACK:?unset — run via scripts/, or eval "$(scripts/hms.py env)"}-core

# Core is single-instance by design (see README § Deployment model). Do not scale
# the `core` service to >1 replicas — the reconciler has no cross-process locking.

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: hms-${HMS_STACK}-core-postgres
    environment:
      POSTGRES_DB: datapro_core
      POSTGRES_USER: datapro
      POSTGRES_PASSWORD: datapro
    ports:
      - "${CORE_PG_PORT:?unset — see above}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapro -d datapro_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build: .
    container_name: hms-${HMS_STACK}-core
    environment:
      DATABASE_URL: postgresql+psycopg://datapro:datapro@postgres:5432/datapro_core
      TRINO_HOST: host.docker.internal
      TRINO_PORT: "${TRINO_PORT:?unset — see above}"
      TRINO_USER: datapro-core
    ports:
      - "${CORE_PORT:?unset — see above}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
