[project]
name = "datapro-core"
version = "0.0.1"
description = "DataPro Core — the data plane: catalog management and Trino reconciliation."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "trino>=0.328",
    "requests>=2.32",
    "flask-cors>=6.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapro_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exclude the perf suite by default (it seeds millions of rows and takes
# minutes). `-m perf` on the CLI overrides this to select it.
addopts = "-m 'not perf'"
markers = [
    "slow: integration tests that restart containers (run with -m slow)",
    "perf: query performance/latency scenarios; excluded by default, run with -m perf",
]

[tool.ruff]
line-length = 100
target-version = "py312"
