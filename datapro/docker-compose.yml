name: hms-datapro

services:
  trino:
    # Custom image extends trinodb/trino with python3 + the flex worker
    # + the flex connector JARs. Built by `scripts/dev-up.sh` (which
    # also ensures the flex JAR is up to date first).
    image: hms-datapro/trino-flex:dev
    build:
      context: ..
      dockerfile: datapro/trino-flex/Dockerfile
    container_name: hms-trino
    ports:
      # Container always listens on 8080; TRINO_PORT only changes the host
      # mapping (set by scripts/_lib.sh, override on hosts where 8080 is taken).
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      # Bind-mount for hand-authored flex modules during dev. Phase B
      # will move modules into Core's Postgres and materialize them to
      # this same path (versioned by hash).
      - ./flex-modules:/var/datapro-flex:ro
      # NOTE: host filesystem access for flex modules is host-OS-specific and
      # lives in an overlay, NOT here. The flex Python worker runs INSIDE this
      # container, so without a mount it can't see files on the host (unlike DB
      # connectors, which reach out over the network). dev-up.sh layers on the
      # matching overlay (docker-compose.macos.yml / docker-compose.linux.yml,
      # selected by DATAPRO_OS_COMPOSE in scripts/_lib.sh), which mounts the
      # host data-bearing roots at the SAME paths so modules can reference real
      # host paths transparently (e.g. /Users/you/data/foo.csv). Create a
      # gitignored docker-compose.override.yml here to add your own mounts.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 30
